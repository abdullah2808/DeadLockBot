services:
  db:
    image: postgres:17.7
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_DB: main
    volumes:
      - deadlock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d main"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/abdullah2808/deadlockbot:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    init: true
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://db:5432/main
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      STEAM_USERNAME: ${STEAM_USERNAME:-}
      STEAM_PASSWORD: ${STEAM_PASSWORD:-}
      STEAM_REFRESH_TOKEN: ${STEAM_REFRESH_TOKEN:-}
      STEAM_TOKEN_FILE: ${STEAM_TOKEN_FILE:-/app/state/steam_refresh_token.txt}
      STEAM_AUTO_ACCEPT_FRIENDS: ${STEAM_AUTO_ACCEPT_FRIENDS:-true}
      STEAM_RICH_PRESENCE_PROBE: ${STEAM_RICH_PRESENCE_PROBE:-false}
      STEAM_METADATA_INTERVAL_SECONDS: ${STEAM_METADATA_INTERVAL_SECONDS:-20}
      STEAM_METADATA_DAILY_LIMIT: ${STEAM_METADATA_DAILY_LIMIT:-40}
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      DEADLOCK_API_STEAM_FALLBACK: ${DEADLOCK_API_STEAM_FALLBACK:-true}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  deadlock_db_data:
